name: CI
on:
  push:
    paths-ignore:
    - 'docs/**'
    - 'README.md'
  pull_request:
    branches:
    - main
    paths-ignore:
    - 'docs/**'
    - 'README.md'
  workflow_dispatch:
    inputs:
      run_full_matrix:
        description: Run tests on all operating systems and .NET versions
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include: ${{ fromJSON((github.ref == 'refs/heads/main' || inputs.run_full_matrix) && '[{"os":"macos-latest","dotnet-version":"8.0.x","target-framework":"net8.0"},{"os":"macos-latest","dotnet-version":"10.0.x","target-framework":"net10.0"},{"os":"windows-latest","dotnet-version":"8.0.x","target-framework":"net8.0"},{"os":"windows-latest","dotnet-version":"10.0.x","target-framework":"net10.0"},{"os":"ubuntu-latest","dotnet-version":"8.0.x","target-framework":"net8.0"},{"os":"ubuntu-latest","dotnet-version":"10.0.x","target-framework":"net10.0"}]' || '[{"os":"ubuntu-latest","dotnet-version":"10.0.x","target-framework":"net10.0"},{"os":"windows-latest","dotnet-version":"8.0.x","target-framework":"net8.0"}]') }}
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    - name: Build Example
      run: dotnet build --configuration Release --framework ${{ matrix.target-framework }} ConsoleMarkdownRenderer.Example
    - name: Test Specs
      run: dotnet test --configuration Release --framework ${{ matrix.target-framework }} ConsoleMarkdownRenderer.Spectre.Tests
    - name: Test
      run: dotnet test --configuration Release --framework ${{ matrix.target-framework }} ConsoleMarkdownRenderer.Tests
    - name: Test Fakes
      run: dotnet test --configuration Release --framework ${{ matrix.target-framework }} ConsoleMarkdownRenderer.Fakes.Tests
    - name: Test ExampleTests
      run: dotnet test --configuration Release --framework ${{ matrix.target-framework }} ConsoleMarkdownRenderer.ExampleTests
    - name: Run Example
      run: dotnet run --configuration Release --framework ${{ matrix.target-framework }} --project ConsoleMarkdownRenderer.Example